    <text x="250" y="475" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="17" text-anchor="middle" fill="#ef4444" letter-spacing="4">HAR BACHHA PADHEGA</text>
